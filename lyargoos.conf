# LyargoOS Configuration
# This file is sourced by mkiso.sh to customize the build

# =============================================================================
# BRAND IDENTITY
# =============================================================================
BRAND_NAME="LyargoOS"
BRAND_VERSION="2024.1"
BRAND_ID="lyargo"
BRAND_PRETTY_NAME="LyargoOS (Void Linux)"
BRAND_HOME_URL="https://github.com/Meniny/LyargoOS"
BRAND_DOC_URL="https://docs.voidlinux.org"

# Path to the lyargoos-artwork repo (relative to this file or absolute)
ARTWORK_DIR="../lyargoos-artwork"

# =============================================================================
# LIVE USER
# LIVE_USER: username for the live session (default: live)
# LIVE_HOSTNAME: hostname shown during live session (default: lyargoos-live)
# LIVE_PASSWORD: password for both root and the live user (default: lyargoos)
# =============================================================================
LIVE_USER="live"
LIVE_HOSTNAME="lyargoos-live"
LIVE_PASSWORD="lyargoos"

# =============================================================================
# REPOSITORIES
# Custom XBPS package repositories
# Each repo will be added to /etc/xbps.d/ in the ISO
#
# Note: The Void nonfree repo is enabled automatically by mkiso.sh
# for x86_64 and aarch64 (provides nvidia drivers, wifi firmware, etc.)
#
# VOID_MIRROR: Default Void Linux repository mirror (can be overridden with -m)
# =============================================================================
VOID_MIRROR="https://repo-default.voidlinux.org/current"

REPOS=(
    "https://github.com/Meniny/LyargoOS-Repo/releases/latest/download"
)

# =============================================================================
# BASE PACKAGES
# Installed on all flavors. These come from Void repos + custom repos above.
# Flavor-specific packages are defined below (KDE_PKGS, XFCE_PKGS, GNOME_PKGS).
# =============================================================================
BASE_PACKAGES=(
    # Core system (Void's base-system pulls in all essentials)
    "base-system"

    # Additional tools not in base-system
    "dialog" "cryptsetup" "lvm2" "mdadm" "elogind"
    "void-docs-browse" "xtools-minimal" "xmirror" "chrony"

    # LyargoOS essentials (meta-package)
    "lyargoos-base"

    # Shell & editors
    "zsh" "nano" "neovim"

    # CLI tools
    "ranger" "mc" "tmux" "git" "curl" "wget" "rsync" "openssl"
    "htop" "eza" "tree" "fzf" "ncdu" "fastfetch" "progress" "glow"
    "newt" "zip" "unzip" "unrar" "gzip" "xz" "p7zip"

    # Services
    "cronie" "nss-mdns" "avahi"

    # Fonts & icons
    "fontconfig" "wqy-microhei" "papirus-icon-theme"

    # Terminal & clipboard
    "alacritty" "CopyQ"

    # GUI utilities
    "gparted" "gnome-disk-utility"

    # Document viewer
    "zathura" "zathura-pdf-mupdf"

    # Media & graphics
    "grim" "gwenview" "celluloid"

    # Input method
    "fcitx5" "fcitx5-qt" "fcitx5-gtk4" "fcitx5-rime" "fcitx5-lua"
    "fcitx5-chinese-addons" "fcitx5-configtool"

    # Flatpak
    "flatpak"

    # Custom
    "brave" "vscodium" "flclash" "peazip"
)

# =============================================================================
# BASE SERVICES
# Enabled at boot on all flavors.
# =============================================================================
BASE_SERVICES=(
    "sshd" "chronyd" "elogind" "cronie" "avahi-daemon"
)

# =============================================================================
# FLAVOR: KDE Plasma
# =============================================================================
KDE_PKGS=(
    "kde5" "konsole" "dolphin" "NetworkManager"
    "lyargoos-kde-theme"
)
KDE_SERVICES=("dbus" "NetworkManager" "sddm" "polkitd")

# =============================================================================
# FLAVOR: XFCE
# =============================================================================
XFCE_PKGS=(
    "xfce4" "xfce4-goodies" "NetworkManager"
)
XFCE_SERVICES=("dbus" "NetworkManager" "lightdm" "polkitd")

# =============================================================================
# FLAVOR: GNOME
# =============================================================================
GNOME_PKGS=(
    "gnome" "nautilus" "NetworkManager"
)
GNOME_SERVICES=("dbus" "NetworkManager" "gdm" "polkitd")

# =============================================================================
# BOOT TITLE
# Text shown in GRUB/isolinux boot menu
# =============================================================================
BOOT_TITLE="LyargoOS"
